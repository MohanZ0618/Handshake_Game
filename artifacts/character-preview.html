<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blockfire — Character visual check</title>
<style>*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:#202520;color:#f2f3ed;font:14px system-ui}header{min-height:76px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 20px}label{display:flex;gap:8px;align-items:center}select{padding:8px;background:#353c33;color:white;border:1px solid #718068}canvas{display:block;width:100%;height:100%;min-height:0}small{margin-left:auto;color:#bec5b6}@media(max-width:1000px){small{display:none}}</style>
<header><strong>CHARACTER VISUAL CHECK</strong><label>Weapon<select id="weapon"><option value="rifle">Assault rifle</option><option value="smg">Compact SMG</option><option value="shotgun">Pump shotgun</option><option value="sniper">Marksman rifle</option></select></label><label>Motion<select id="motion"><option value="idle">Idle</option><option value="run">Run</option><option value="strafe">Strafe</option><option value="jump">Jump pose</option></select></label><label>View<select id="view"><option value="side">Side</option><option value="front">Front quarter</option><option value="rear">Rear quarter</option></select></label><small>Live character rig · two hands · shoulder stock</small></header>
<canvas id="game"></canvas><script type="module" src="/scripts/character-preview.ts"></script></html>
