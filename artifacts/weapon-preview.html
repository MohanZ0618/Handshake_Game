<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blockfire — Weapon visual check</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#171c20;color:#e8e9e5;font:14px system-ui}header{height:74px;display:flex;gap:24px;align-items:center;padding:12px 24px;border-bottom:1px solid #4a4e4b}label{display:flex;gap:8px;align-items:center}select{background:#303731;color:white;border:1px solid #596354;padding:8px}main{position:relative;height:calc(100vh - 74px);overflow:hidden}#game{display:block;width:100%;height:100%}#reticle{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#ff2525;font-size:20px}#scope{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}#scope i{height:64%;aspect-ratio:1;border-radius:50%;border:7px solid #202324;box-shadow:0 0 0 100vmax #0a0b0cd4;position:relative}#scope i:before,#scope i:after{content:"";position:absolute;background:#171a1b}#scope i:before{width:1px;height:100%;left:50%}#scope i:after{height:1px;width:100%;top:50%}small{margin-left:auto;color:#adb7ab}
</style>
<header><strong>WEAPON VISUAL CHECK</strong><label>Weapon<select id="weapon"><option value="rifle">Assault rifle</option><option value="smg">Compact SMG</option><option value="shotgun">Pump shotgun</option><option value="sniper">Marksman rifle</option></select></label><label>Finish<select id="finish"><option value="">Factory</option><option value="skin-cinder">Cinder Steel</option><option value="skin-cinder-graphite">Cinder Graphite</option><option value="skin-cinder-teal">Cinder Teal</option><option value="skin-oxide">Oxide Blue</option><option value="skin-sand">Desert Alloy</option></select></label><label><input type="checkbox" id="ads">Aim down sights</label><small>Same renderer and weapon geometry as the game</small></header>
<main><canvas id="game"></canvas><div id="scope"><i></i></div><div id="reticle">·</div></main><canvas id="minimap" width="240" height="160" hidden></canvas>
<script type="module" src="/scripts/weapon-preview.ts"></script></html>
